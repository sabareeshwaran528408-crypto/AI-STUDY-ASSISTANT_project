<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - AI Study Assistant</title>

    <script src="./settings.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #172033;

        }


        .container {

            width: 100%;

            max-width: 450px;

            padding: 20px;

        }


        .card {

            background: white;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 15px 45px
                rgba(0,0,0,0.10);

            border:
                1px solid #e5e7eb;

        }


        .logo {

            text-align: center;

            color: #4f46e5;

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 8px;

        }


        h1 {

            text-align: center;

            font-size: 25px;

            margin: 0;

        }


        .subtitle {

            text-align: center;

            color: #667085;

            margin:
                8px 0 28px;

        }


        .form-group {

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            font-size: 14px;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79,70,229,0.12);

        }


        .signup-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .signup-button:hover {

            background: #4338ca;

        }


        .signup-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .message {

            display: none;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

        }


        .message.show {

            display: block;

        }


        .message.error {

            background: #fee2e2;

            color: #991b1b;

        }


        .message.success {

            background: #dcfce7;

            color: #166534;

        }


        .login-link {

            text-align: center;

            margin-top: 22px;

            color: #667085;

            font-size: 14px;

        }


        .login-link a {

            color: #4f46e5;

            font-weight: bold;

            text-decoration: none;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        .password-info {

            color: #667085;

            font-size: 12px;

            margin-top: 6px;

        }


        .show-password {

            display: flex;

            align-items: center;

            gap: 8px;

            margin:
                8px 0 20px;

            font-size: 13px;

            color: #667085;

        }


        .show-password input {

            width: auto;

        }


        /* Dark mode */

        html[data-dark-mode="on"] body {

            background: #0f172a;

            color: #f9fafb;

        }


        html[data-dark-mode="on"] .card {

            background: #111827;

            border-color: #374151;

        }


        html[data-dark-mode="on"] .subtitle,

        html[data-dark-mode="on"] .login-link,

        html[data-dark-mode="on"] .password-info,

        html[data-dark-mode="on"] .show-password {

            color: #cbd5e1;

        }


        html[data-dark-mode="on"] input {

            background: #1f2937;

            color: white;

            border-color: #4b5563;

        }


        @media (max-width: 500px) {

            .card {

                padding: 25px;

            }

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                AI Study Assistant
            </div>


            <h1>
                Create Account
            </h1>


            <p class="subtitle">
                Start your personalized learning journey
            </p>


            <div
                id="message"
                class="message"
            ></div>


            <form id="signupForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <div class="password-info">
                        Password must contain at least 6 characters.
                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <label class="show-password">

                    <input
                        type="checkbox"
                        id="showPassword"
                    >

                    Show passwords

                </label>


                <button
                    type="submit"
                    class="signup-button"
                    id="signupButton"
                >
                    Create Account
                </button>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script>

    const API_BASE = "https://ai-study-assistant-production-ce2c.up.railway.app";


        const form =
            document.getElementById("signupForm");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const button =
            document.getElementById("signupButton");

        const message =
            document.getElementById("message");

        const showPassword =
            document.getElementById("showPassword");


        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent = text;

            message.className =
                `message show ${type}`;

        }


        showPassword.addEventListener(
            "change",
            () => {

                const type =
                    showPassword.checked
                        ? "text"
                        : "password";

                passwordInput.type = type;

                confirmPasswordInput.type =
                    type;

            }
        );


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const name =
                    nameInput.value.trim();

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match."
                    );

                    return;

                }


                if (password.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters."
                    );

                    return;

                }


                button.disabled = true;

                button.textContent =
                    "Creating account...";


                try {

                    const response =
                        await fetch(
                            `${API_BASE}/api/auth/signup`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        name,

                                        email,

                                        password

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Unable to create account."
                        );

                    }


                    /* Save authentication */

                    localStorage.setItem(
                        "aiStudyAuthToken",
                        data.token
                    );


                    localStorage.setItem(
                        "aiStudyUser",
                        JSON.stringify(
                            data.user
                        )
                    );


                    showMessage(
                        "Account created successfully. Redirecting...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "dashboard.html";

                        },
                        700
                    );


                } catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    showMessage(
                        error.message
                    );


                } finally {

                    button.disabled = false;

                    button.textContent =
                        "Create Account";

                }

            }
        );

    </script>

</body>

</html>
