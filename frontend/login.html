<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - AI Study Assistant</title>

    <script src="./settings.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #172033;

        }


        .login-container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

        }


        .login-card {

            background: white;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.10);

            border:
                1px solid #e5e7eb;

        }


        .logo {

            text-align: center;

            color: #4f46e5;

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 8px;

        }


        .title {

            text-align: center;

            font-size: 25px;

            margin: 0;

        }


        .subtitle {

            text-align: center;

            color: #667085;

            margin:
                8px 0 28px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            font-size: 14px;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79,70,229,0.12);

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .login-button:hover {

            background: #4338ca;

        }


        .login-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .message {

            display: none;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

        }


        .message.show {

            display: block;

        }


        .message.error {

            background: #fee2e2;

            color: #991b1b;

        }


        .message.success {

            background: #dcfce7;

            color: #166534;

        }


        .signup-link {

            text-align: center;

            margin-top: 22px;

            color: #667085;

            font-size: 14px;

        }


        .signup-link a {

            color: #4f46e5;

            font-weight: bold;

            text-decoration: none;

        }


        .signup-link a:hover {

            text-decoration: underline;

        }


        .show-password {

            display: flex;

            align-items: center;

            gap: 8px;

            margin:
                8px 0 20px;

            font-size: 13px;

            color: #667085;

        }


        .show-password input {

            width: auto;

        }


        /* Dark mode */

        html[data-dark-mode="on"] body {

            background: #0f172a;

            color: #f9fafb;

        }


        html[data-dark-mode="on"] .login-card {

            background: #111827;

            border-color: #374151;

        }


        html[data-dark-mode="on"] .subtitle,

        html[data-dark-mode="on"] .signup-link,

        html[data-dark-mode="on"] .show-password {

            color: #cbd5e1;

        }


        html[data-dark-mode="on"] input {

            background: #1f2937;

            color: white;

            border-color: #4b5563;

        }


        @media (max-width: 500px) {

            .login-card {

                padding: 25px;

            }

        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                AI Study Assistant
            </div>

            <h1 class="title">
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to continue your learning
            </p>


            <div
                id="message"
                class="message"
            ></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <label class="show-password">

                    <input
                        type="checkbox"
                        id="showPassword"
                    >

                    Show password

                </label>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">
                    Create account
                </a>

            </div>

        </div>

    </div>


    <script>

        const API_BASE =
            "https://ai-study-assistant-production-ce2c.up.railway.app";


        const form =
            document.getElementById("loginForm");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const button =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        const showPassword =
            document.getElementById("showPassword");


        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent = text;

            message.className =
                `message show ${type}`;

        }


        showPassword.addEventListener(
            "change",
            () => {

                password.type =
                    showPassword.checked
                        ? "text"
                        : "password";

            }
        );


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                button.disabled = true;

                button.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            `${API_BASE}/api/auth/login`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        email:
                                            email.value,

                                        password:
                                            password.value

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Login failed."
                        );

                    }


                    /* Save authentication */

                    localStorage.setItem(
                        "aiStudyAuthToken",
                        data.token
                    );


                    localStorage.setItem(
                        "aiStudyUser",
                        JSON.stringify(
                            data.user
                        )
                    );


                    showMessage(
                        "Login successful. Redirecting...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "dashboard.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        error.message
                    );


                } finally {

                    button.disabled = false;

                    button.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>

</html>
