<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - AI Study Assistant</title>

    <script src="./settings.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            display: flex;
            align-items: center;
            justify-content: center;

            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 35px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.10);

            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            color: #4f46e5;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin: 0;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin: 8px 0 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #4f46e5;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            padding: 12px;
            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            text-align: center;
            margin-top: 22px;

            color: #667085;
            font-size: 14px;
        }

        .back-link a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        html[data-dark-mode="on"] body {
            background: #0f172a;
            color: #f9fafb;
        }

        html[data-dark-mode="on"] .card {
            background: #111827;
            border-color: #374151;
        }

        html[data-dark-mode="on"] .subtitle,
        html[data-dark-mode="on"] .back-link {
            color: #cbd5e1;
        }

        html[data-dark-mode="on"] input {
            background: #1f2937;
            color: white;
            border-color: #4b5563;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px;
            }
        }
    </style>
</head>


<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                AI Study Assistant
            </div>

            <h1>
                Reset Password
            </h1>

            <p class="subtitle">
                Create a new password for your account.
            </p>


            <div
                id="message"
                class="message"
            ></div>


            <form id="resetPasswordForm">

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="resetButton"
                >
                    Reset Password
                </button>

            </form>


            <div class="back-link">

                <a href="index.html">
                    Back to Login
                </a>

            </div>

        </div>

    </div>


    <script>

        const API_BASE =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"

                ? "http://localhost:5000"

                : "https://ai-study-assistant-production-ce2c.up.railway.app";


        const params =
            new URLSearchParams(
                window.location.search
            );


        const token =
            params.get("token");


        const form =
            document.getElementById(
                "resetPasswordForm"
            );


        const password =
            document.getElementById(
                "password"
            );


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );


        const button =
            document.getElementById(
                "resetButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent = text;

            message.className =
                `message show ${type}`;

        }


        if (!token) {

            showMessage(
                "This reset link is invalid. Please request a new password reset link."
            );

            button.disabled = true;

        }


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                if (!token) {

                    showMessage(
                        "Invalid reset link."
                    );

                    return;

                }


                if (password.value.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters."
                    );

                    return;

                }


                if (
                    password.value !==
                    confirmPassword.value
                ) {

                    showMessage(
                        "Passwords do not match."
                    );

                    return;

                }


                button.disabled = true;

                button.textContent =
                    "Resetting...";


                try {

                    const response =
                        await fetch(
                            `${API_BASE}/api/auth/reset-password`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        token: token,

                                        password:
                                            password.value

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Unable to reset password."
                        );

                    }


                    showMessage(
                        "Password reset successfully. You can now log in.",
                        "success"
                    );


                    form.reset();


                    setTimeout(() => {

                        window.location.href =
                            "index.html";

                    }, 2000);


                } catch (error) {

                    console.error(
                        "Reset password error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Something went wrong."
                    );

                } finally {

                    button.disabled = false;

                    button.textContent =
                        "Reset Password";

                }

            }
        );

    </script>

</body>

</html>
