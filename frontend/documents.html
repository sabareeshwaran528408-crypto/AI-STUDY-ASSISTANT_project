<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Documents - AI Study Assistant</title>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
            type="module"></script>

    <!-- Tesseract OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #111827;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .dashboard-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 17px;
            border-radius: 8px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed #2563eb;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            background: #f8faff;
        }

        .upload-area p {
            margin-bottom: 15px;
            color: #6b7280;
        }

        .file-input {
            display: none;
        }

        .choose-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .choose-btn:hover {
            background: #1d4ed8;
        }

        .file-name {
            margin-top: 15px;
            font-weight: bold;
        }

        .upload-btn {
            margin-top: 15px;
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .upload-btn:hover {
            background: #15803d;
        }

        .upload-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.2s;
        }

        .progress-text {
            margin-top: 8px;
            font-size: 14px;
            color: #4b5563;
        }

        .status {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .documents {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .document-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            background: white;
        }

        .document-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .document-name {
            font-weight: bold;
            word-break: break-word;
            margin-bottom: 8px;
        }

        .document-date {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .document-actions {
            display: flex;
            gap: 8px;
        }

        .ask-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 7px;
            font-size: 14px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 30px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #2563eb;
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 19px;
            }

            .container {
                padding: 10px;
                margin: 15px auto;
            }

            .card {
                padding: 18px;
            }

            .upload-area {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <h1>📚 My Documents</h1>

    <a href="dashboard.html" class="dashboard-btn">
        Dashboard
    </a>

</header>


<main class="container">

    <!-- ============================= -->
    <!-- UPLOAD -->
    <!-- ============================= -->

    <section class="card">

        <h2>📄 Upload Question Bank</h2>

        <div class="upload-area">

            <p>
                Upload your PDF question bank.
            </p>

            <p>
                Maximum file size: 100 MB
            </p>

            <label for="pdfFile" class="choose-btn">
                Choose PDF
            </label>

            <input
                type="file"
                id="pdfFile"
                class="file-input"
                accept="application/pdf,.pdf"
            >

            <div
                id="fileName"
                class="file-name"
            >
                No file selected
            </div>

            <button
                id="uploadButton"
                class="upload-btn"
                disabled
            >
                Upload PDF
            </button>

        </div>


        <!-- Progress -->

        <div
            id="progressContainer"
            class="progress-container"
        >

            <div class="progress-bar">

                <div
                    id="progress"
                    class="progress"
                ></div>

            </div>

            <div
                id="progressText"
                class="progress-text"
            >
                Preparing upload...
            </div>

        </div>


        <div
            id="status"
            class="status"
        ></div>

    </section>


    <!-- ============================= -->
    <!-- DOCUMENT LIST -->
    <!-- ============================= -->

    <section class="card">

        <h2>📚 Uploaded Question Banks</h2>

        <div
            id="documents"
            class="documents"
        >

            <div class="loading">
                Loading documents...
            </div>

        </div>

    </section>

</main>


<script>

    // ==================================================
    // IMPORTANT
    // SAME BACKEND AS ASK AI
    // ==================================================

    const API_BASE = "http://localhost:5000";


    // ==================================================
    // ELEMENTS
    // ==================================================

    const pdfFile =
        document.getElementById("pdfFile");

    const fileName =
        document.getElementById("fileName");

    const uploadButton =
        document.getElementById("uploadButton");

    const documentsContainer =
        document.getElementById("documents");

    const statusBox =
        document.getElementById("status");

    const progressContainer =
        document.getElementById("progressContainer");

    const progress =
        document.getElementById("progress");

    const progressText =
        document.getElementById("progressText");


    // ==================================================
    // FILE SELECTED
    // ==================================================

    pdfFile.addEventListener(
        "change",
        function () {

            const file =
                pdfFile.files[0];


            if (!file) {

                fileName.textContent =
                    "No file selected";

                uploadButton.disabled =
                    true;

                return;
            }


            if (
                file.type !== "application/pdf" &&
                !file.name.toLowerCase().endsWith(".pdf")
            ) {

                showStatus(
                    "Please select a PDF file.",
                    "error"
                );

                pdfFile.value = "";

                fileName.textContent =
                    "No file selected";

                uploadButton.disabled =
                    true;

                return;
            }


            // 100 MB limit

            const maxSize =
                100 * 1024 * 1024;


            if (file.size > maxSize) {

                showStatus(
                    "PDF size must be less than 100 MB.",
                    "error"
                );

                pdfFile.value = "";

                fileName.textContent =
                    "No file selected";

                uploadButton.disabled =
                    true;

                return;
            }


            fileName.textContent =
                `${file.name} (${formatFileSize(file.size)})`;

            uploadButton.disabled =
                false;

            hideStatus();

        }
    );


    // ==================================================
    // UPLOAD BUTTON
    // ==================================================

    uploadButton.addEventListener(
        "click",
        uploadPDF
    );


    // ==================================================
    // UPLOAD PDF
    // ==================================================

    async function uploadPDF() {

        const file =
            pdfFile.files[0];


        if (!file) {

            showStatus(
                "Please select a PDF first.",
                "error"
            );

            return;
        }


        uploadButton.disabled =
            true;

        progressContainer.style.display =
            "block";

        setProgress(
            10,
            "Uploading PDF..."
        );

        hideStatus();


        try {

            const formData =
                new FormData();

            formData.append(
                "pdf",
                file
            );


            const response =
                await fetch(
                    `${API_BASE}/api/documents/upload`,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            console.log(
                "Upload response:",
                data
            );


            /*
             * IMPORTANT:
             *
             * If the backend says the PDF is scanned,
             * browser OCR will be used.
             */

            if (
                response.status === 400 &&
                data.scanned === true
            ) {

                setProgress(
                    15,
                    "Scanned PDF detected. Starting OCR..."
                );


                await performOCR(
                    file
                );


                return;
            }


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "PDF upload failed."
                );

            }


            setProgress(
                100,
                "Upload completed!"
            );


            showStatus(
                "PDF uploaded successfully.",
                "success"
            );


            pdfFile.value = "";

            fileName.textContent =
                "No file selected";


            uploadButton.disabled =
                true;


            // Reload document list

            await loadDocuments();


        } catch (error) {

            console.error(
                "Upload error:",
                error
            );


            showStatus(
                error.message ||
                "Failed to upload PDF.",
                "error"
            );


            setProgress(
                0,
                "Upload failed."
            );


        } finally {

            uploadButton.disabled =
                false;

        }

    }


    // ==================================================
    // OCR FOR SCANNED PDF
    // ==================================================

    async function performOCR(file) {

        try {

            if (
                typeof Tesseract === "undefined"
            ) {

                throw new Error(
                    "OCR library failed to load."
                );

            }


            /*
             * PDF.js module is loaded separately.
             * We use browser PDF rendering through
             * the global PDF.js module if available.
             */

            setProgress(
                20,
                "Preparing scanned PDF..."
            );


            /*
             * For very large scanned PDFs,
             * OCR can use significant memory.
             */

            const arrayBuffer =
                await file.arrayBuffer();


            let pdf;


            try {

                /*
                 * Try dynamic PDF.js import.
                 */

                const pdfjsLib =
                    await import(
                        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
                    );


                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


                pdf =
                    await pdfjsLib.getDocument({
                        data: arrayBuffer
                    }).promise;


            } catch (pdfError) {

                console.error(
                    "PDF.js error:",
                    pdfError
                );

                throw new Error(
                    "Could not read the scanned PDF in the browser."
                );

            }


            const totalPages =
                pdf.numPages;


            let fullText = "";


            /*
             * Create OCR worker
             */

            setProgress(
                25,
                `Starting OCR... 0/${totalPages} pages`
            );


            const worker =
                await Tesseract.createWorker(
                    "eng"
                );


            try {

                for (
                    let pageNumber = 1;
                    pageNumber <= totalPages;
                    pageNumber++
                ) {

                    const page =
                        await pdf.getPage(
                            pageNumber
                        );


                    const viewport =
                        page.getViewport({
                            scale: 1.5
                        });


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    const context =
                        canvas.getContext(
                            "2d"
                        );


                    canvas.width =
                        viewport.width;

                    canvas.height =
                        viewport.height;


                    await page.render({
                        canvasContext:
                            context,
                        viewport:
                            viewport
                    }).promise;


                    const image =
                        canvas.toDataURL(
                            "image/png"
                        );


                    const result =
                        await worker.recognize(
                            image
                        );


                    if (
                        result &&
                        result.data &&
                        result.data.text
                    ) {

                        fullText +=
                            "\n\n" +
                            `--- Page ${pageNumber} ---\n\n` +
                            result.data.text;

                    }


                    const percent =
                        25 +
                        Math.round(
                            (pageNumber /
                                totalPages) *
                            65
                        );


                    setProgress(
                        percent,
                        `OCR processing: ${pageNumber}/${totalPages} pages`
                    );


                    /*
                     * Release canvas memory
                     */

                    canvas.width = 1;

                    canvas.height = 1;

                }

            } finally {

                await worker.terminate();

            }


            if (
                !fullText.trim()
            ) {

                throw new Error(
                    "OCR could not extract any text from this PDF."
                );

            }


            setProgress(
                92,
                "Saving OCR text..."
            );


            /*
             * Save OCR text to backend
             */

            const response =
                await fetch(
                    `${API_BASE}/api/documents/text`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            fileName:
                                file.name,

                            text:
                                fullText

                        })

                    }
                );


            const data =
                await response.json();


            console.log(
                "OCR save response:",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Failed to save OCR text."
                );

            }


            setProgress(
                100,
                "OCR completed!"
            );


            showStatus(
                "Scanned PDF processed successfully using OCR.",
                "success"
            );


            pdfFile.value = "";

            fileName.textContent =
                "No file selected";


            uploadButton.disabled =
                true;


            await loadDocuments();


        } catch (error) {

            console.error(
                "OCR error:",
                error
            );


            showStatus(
                "OCR failed: " +
                error.message,
                "error"
            );


            setProgress(
                0,
                "OCR failed."
            );

        }

    }


    // ==================================================
    // LOAD DOCUMENTS
    // ==================================================

    async function loadDocuments() {

        documentsContainer.innerHTML = `
            <div class="loading">
                Loading documents...
            </div>
        `;


        try {

            const response =
                await fetch(
                    `${API_BASE}/api/documents`
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            console.log(
                "Documents:",
                data
            );


            const documents =
                data.documents || [];


            if (
                documents.length === 0
            ) {

                documentsContainer.innerHTML = `
                    <div class="empty">
                        No documents uploaded yet.
                    </div>
                `;

                return;
            }


            documentsContainer.innerHTML =
                "";


            documents.forEach(
                document => {

                    const card =
                        createDocumentCard(
                            document
                        );

                    documentsContainer.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(
                "Document loading error:",
                error
            );


            documentsContainer.innerHTML = `
                <div class="empty">
                    ❌ Cannot connect to backend.
                    <br><br>
                    Make sure server.js is running on port 5000.
                </div>
            `;

        }

    }


    // ==================================================
    // CREATE DOCUMENT CARD
    // ==================================================

    function createDocumentCard(document) {

        const card =
            document.createElement ?
            document.createElement("div") :
            null;


        /*
         * Use browser document object explicitly.
         */

        const div =
            window.document.createElement(
                "div"
            );


        div.className =
            "document-card";


        const date =
            document.created_at
                ? new Date(
                    document.created_at
                ).toLocaleString()
                : "Unknown date";


        div.innerHTML = `

            <div class="document-icon">
                📄
            </div>

            <div class="document-name">
                ${escapeHtml(
                    document.file_name ||
                    "Untitled PDF"
                )}
            </div>

            <div class="document-date">
                Uploaded: ${date}
            </div>

            <div class="document-actions">

                <a
                    class="ask-btn"
                    href="ask-ai.html?documentId=${document.id}"
                >
                    🤖 Ask AI
                </a>

                <button
                    class="delete-btn"
                    onclick="deleteDocument(${document.id})"
                >
                    Delete
                </button>

            </div>
        `;


        return div;

    }


    // ==================================================
    // DELETE DOCUMENT
    // ==================================================

    async function deleteDocument(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this document?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_BASE}/api/documents/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Delete failed."
                );

            }


            showStatus(
                "Document deleted successfully.",
                "success"
            );


            await loadDocuments();


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );


            showStatus(
                error.message ||
                "Failed to delete document.",
                "error"
            );

        }

    }


    // ==================================================
    // PROGRESS
    // ==================================================

    function setProgress(
        value,
        message
    ) {

        progress.style.width =
            `${value}%`;

        progressText.textContent =
            message;

    }


    // ==================================================
    // STATUS
    // ==================================================

    function showStatus(
        message,
        type
    ) {

        statusBox.textContent =
            message;

        statusBox.className =
            `status ${type}`;

    }


    function hideStatus() {

        statusBox.style.display =
            "none";

        statusBox.className =
            "status";

        statusBox.textContent =
            "";

    }


    // ==================================================
    // FILE SIZE
    // ==================================================

    function formatFileSize(bytes) {

        if (bytes === 0) {

            return "0 Bytes";

        }


        const units = [
            "Bytes",
            "KB",
            "MB",
            "GB"
        ];


        const index =
            Math.floor(
                Math.log(bytes) /
                Math.log(1024)
            );


        return (
            parseFloat(
                (
                    bytes /
                    Math.pow(
                        1024,
                        index
                    )
                ).toFixed(2)
            ) +
            " " +
            units[index]
        );

    }


    // ==================================================
    // ESCAPE HTML
    // ==================================================

    function escapeHtml(text) {

        const div =
            window.document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;

    }


    // ==================================================
    // START
    // ==================================================

    loadDocuments();

</script>

</body>
</html>
